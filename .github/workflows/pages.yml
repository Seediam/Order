name: Publicar ORDER no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Separar arquivos do jogo
        run: |
          mkdir -p _site
          cp index.html registro.html manhwa.css manhwa.js manhwa-story.js dice3d.js .nojekyll _site/
          cp -R assets _site/assets
          mkdir -p _site/Fonts
          cp Fonts/*.ttf Fonts/OFL.txt _site/Fonts/
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
