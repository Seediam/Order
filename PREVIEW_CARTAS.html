<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ORDER — Cartas</title><link rel="stylesheet" href="style.css"><style>html,body{overflow:auto;height:auto}body{background:#0c0c10;color:#fff;padding:24px}h1{font-family:var(--title);letter-spacing:.3em;text-align:center}p{text-align:center;color:#d7d7de;font-size:18px}a{color:#ff76c7}h2{font-family:var(--title);margin:28px 0 12px;color:#ff9ad0}.grid{display:flex;flex-wrap:wrap;gap:22px;max-width:1400px;margin:0 auto}</style></head><body><h1>O R D E R</h1><p>Cartas com arte provisória (SVG). Tipos: Ação, Reação, Armadilha. <a href="index.html?preview=combat">Abrir combate de prévia</a> · <a href="index.html?preview=combat&route=mercy">Eco do Contrato</a> · <a href="index.html?preview=combat&route=defer">Guardião do Prazo</a></p><div id="out"></div>
<script src="card-art.js"></script><script src="cards.js"></script><script src="combat-rules.js"></script><script>
const groups={};for(const c of Object.values(CARDS))(groups[c.sector]=groups[c.sector]||[]).push(c);
let html='';for(const [s,list] of Object.entries(groups))html+=`<h2>${s}</h2><div class="grid">${list.map(c=>CardArt.card(c,'big')).join('')}</div>`;
html+=`<h2>EQUIPAMENTO</h2><div class="grid">${CardArt.card(WEAPON,'big')}${CardArt.back('big')}</div>`;
html+=`<h2>INIMIGOS</h2><div class="grid">${Object.values(CombatRules.ENEMY_CARDS).map(c=>CardArt.card({...c,id:'',sector:'INIMIGO'},'big',{text:c.text})).join('')}</div>`;
document.getElementById('out').innerHTML=html;</script></body></html>
