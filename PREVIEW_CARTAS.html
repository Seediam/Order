<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ORDER — Prévia da Mão de Cartas</title><style>body{background:#0c0c10;color:#fff;font-family:Arial,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;text-align:center}main{max-width:490px;padding:25px;border:1px solid #ff76c74d;background:#17131a}h1{letter-spacing:.32em;font-size:34px}p{line-height:1.7;color:#d7d7de}button{margin-top:20px;cursor:pointer;background:#ff2f8e;border:0;color:#0c0c10;padding:16px 22px;font-weight:bold;letter-spacing:.1em}</style></head><body><main><h1>O R D E R</h1><p>Prévia de desenvolvimento: abra diretamente o combate com seis cartas na mão para testar o novo leque, o destaque ao passar o mouse e as ações de Usar/Queimar.</p><button id="go">VISUALIZAR MÃO DE CARTAS →</button></main><script>document.getElementById('go').addEventListener('click',()=>{const types=['shot','guard','mend','expose','step','signature'];const extra=['shot','guard','expose','mend','signature','shot','guard','step','expose','mend','signature','shot','guard','step'];const card=(type,i)=>({uid:'demo'+i,type});const c={hp:34,maxHp:34,shield:0,bossHp:18,bossMax:18,player:{x:3,y:2},boss:{x:6,y:2},move:2,action:1,round:1,pile:extra.map((t,i)=>card(t,i+6)),hand:types.map((t,i)=>card(t,i)),discard:[],banned:[],paperCd:0,usedBurn:false,weak:0,log:['O Portão Zero observa sua decisão.'],phase:'player',last:'A senhora observa a sua mão. Ela parece ter medo de sua próxima escolha.'};const state={version:2,stage:'combat',name:'Procurador',sector:'JUSTIÇA',gender:'homem',moral:8,trust:8,sanity:10,fame:0,clues:[],visited:['nave'],combat:c};localStorage.setItem('order_prologue_v2',JSON.stringify(state));location.href='index.html'})</script></body></html>
