<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07050a">
  <meta name="description" content="ORDER — O Pecado da Misericórdia. Uma história em quadrinhos interativa de terror: conheça o RPG ORDER, crie seu Searcher e decida o destino de Dona Elvira.">
  <title>ORDER — O Pecado da Misericórdia</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/web/logo.webp" as="image">
  <link rel="preload" href="assets/web/elvira-demon.webp" as="image">
  <link rel="stylesheet" href="manhwa.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal-wrap" role="dialog" aria-modal="true"></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="eyelids" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="startup-error"><h1>O livro precisa de JavaScript.</h1><p>Ative o JavaScript para ler a história do ORDER.</p></div></noscript>
  <script>
    function showStartupError(message){if(document.querySelector('.startup-error'))return;const p=document.createElement('section');p.className='startup-error';p.setAttribute('role','alert');p.innerHTML='<h1>Não foi possível abrir o livro.</h1><p></p><p>Mantenha index.html, manhwa.css, manhwa.js, manhwa-story.js, dice3d.js, Fonts e assets na mesma pasta e recarregue.</p>';p.querySelector('p').textContent=String(message);document.body.append(p)}
    window.addEventListener('error',e=>{if(e.message)showStartupError(e.message);else if(e.target&&e.target.tagName==='SCRIPT')showStartupError('Arquivo ausente: '+e.target.getAttribute('src'))},true);
  </script>
  <script src="manhwa-story.js" defer></script>
  <script src="dice3d.js" defer></script>
  <script src="manhwa.js" defer></script>
</body>
</html>
